<aside class="hidden w-[270px] shrink-0 border-r border-slate-200 bg-white p-5 lg:block">
  <div class="mb-8 mt-2 flex items-center gap-3">
    <span class="inline-flex h-9 w-9 items-center justify-center rounded-lg bg-primary text-white">S</span>
    <div>
      <p class="text-sm font-bold text-slate-900">StockFlow</p>
      <p class="text-xs text-slate-500">{{ mode() === 'platform' ? 'Platform Admin' : 'Workspace' }}</p>
    </div>
  </div>

  <nav class="space-y-1">
    @for (item of items(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-primary/10 text-primary font-medium"
        [routerLinkActiveOptions]="{exact: false}"
        class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-900"
      >
        <span class="text-xs uppercase opacity-70">{{ item.icon }}</span>
        <span>{{ item.title }}</span>
      </a>
    }
  </nav>
</aside>
