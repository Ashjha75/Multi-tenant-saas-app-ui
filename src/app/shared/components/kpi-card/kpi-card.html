<article class="app-kpi-card p-5">
  <div class="mb-4 flex items-center justify-between">
    <p class="text-sm text-slate-400">{{ label() }}</p>
    <span class="rounded-full border border-white/10 bg-white/5 px-2 py-1 text-[11px] text-slate-300">KPI</span>
  </div>
  <p class="text-3xl font-bold text-slate-100">{{ value() }}</p>
  <div class="mt-4 flex items-center justify-between">
    <p class="text-sm" [class.text-success]="trend() === 'up'" [class.text-danger]="trend() === 'down'" [class.text-slate-400]="trend() === 'neutral'">
      {{ change() }}
    </p>
    <div class="h-8 w-16 rounded-lg bg-white/5"></div>
  </div>
</article>
