<app-modal [open]="open()" [title]="title()" (close)="onCancel()">
  <p class="mb-6 text-sm text-slate-300">{{ message() }}</p>
  <div class="flex justify-end gap-3">
    <app-button variant="ghost" (clicked)="onCancel()">Cancel</app-button>
    <app-button variant="danger" (clicked)="onConfirm()">Confirm</app-button>
  </div>
</app-modal>
