<aside class="hidden w-[270px] shrink-0 border-r border-slate-200 bg-white p-5 lg:block sticky top-0 h-screen overflow-y-auto">
  <div class="mb-8 mt-2 px-2">
    <p class="text-xs font-bold uppercase tracking-wider text-slate-400">
      {{ mode() === 'platform' ? 'Platform Admin' : 'Workspace' }}
    </p>
  </div>

  <nav class="space-y-1">
    @for (item of items(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-primary/10 text-primary font-medium"
        [routerLinkActiveOptions]="{exact: false}"
        class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm text-slate-600 transition-colors hover:bg-slate-50 hover:text-slate-900"
      >
        <lucide-icon [img]="icons[item.icon]" class="h-4 w-4"></lucide-icon>
        <span>{{ item.title }}</span>
      </a>
    }
  </nav>
</aside>
