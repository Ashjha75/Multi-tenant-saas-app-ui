<aside class="hidden w-[270px] shrink-0 bg-[#1e1b4b] lg:block sticky top-0 h-screen flex flex-col overflow-hidden shadow-2xl">
  <!-- Header -->
  <div class="p-6 mb-2">
    <p class="text-xs font-bold uppercase tracking-widest text-slate-400/60">
      {{ mode() === 'platform' ? 'Platform Admin' : 'Workspace' }}
    </p>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-3 space-y-1 overflow-y-auto custom-scrollbar">
    @for (item of items(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-white/10 text-white font-medium shadow-sm"
        [routerLinkActiveOptions]="{exact: false}"
        class="flex items-center gap-3 rounded-xl px-4 py-3.5 text-sm text-slate-400 transition-all duration-200 hover:bg-white/5 hover:text-white group"
      >
        <lucide-icon [img]="icons[item.icon]" class="h-[18px] w-[18px] opacity-70 group-hover:opacity-100 transition-opacity"></lucide-icon>
        <span>{{ item.title }}</span>
      </a>
    }
  </nav>

  <!-- Footer Profile & Logout -->
  <div class="p-4 border-t border-white/5 bg-black/10">
    <!-- Profile Info -->
    <div class="flex items-center gap-3 px-3 py-4 mb-2">
      <div class="h-10 w-10 rounded-full bg-primary/20 flex items-center justify-center border border-primary/30">
        <lucide-icon [img]="User" class="h-5 w-5 text-primary-light"></lucide-icon>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-white truncate">Company Admin</p>
        <p class="text-[11px] text-slate-400 truncate">Tenant Manager</p>
      </div>
    </div>

    <!-- Logout Button -->
    <button 
      (click)="logout()"
      class="w-full flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-red-400/80 transition-all hover:bg-red-500/10 hover:text-red-400 font-medium"
    >
      <lucide-icon [img]="LogOut" class="h-[18px] w-[18px]"></lucide-icon>
      <span>Logout</span>
    </button>
  </div>
</aside>
