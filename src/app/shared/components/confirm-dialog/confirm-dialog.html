<app-modal [open]="open()" [title]="title()" (close)="onCancel()">
  <p class="mb-6 text-sm text-slate-600 font-medium">{{ message() }}</p>
  <div class="flex justify-end gap-3">
    <button (click)="onCancel()" class="px-6 py-2.5 rounded-button border border-slate-200 text-slate-700 text-sm font-semibold hover:bg-slate-50 transition-colors">Cancel</button>
    <app-button variant="danger" (clicked)="onConfirm()">Confirm</app-button>
  </div>
</app-modal>
