<aside
  class="hidden lg:flex w-[270px] h-screen shrink-0 flex-col justify-between bg-[#f8f8f8] border-r border-slate-200 sticky top-0">

  <!-- Top area -->
  <div class="flex flex-col min-h-0">

    <!-- Header -->
    <div class="p-6">
      <div class="flex items-center gap-3">
        <div class="h-8 w-8 bg-primary rounded-lg flex items-center justify-center text-white shadow-lg shadow-primary/20">
          <lucide-icon [img]="icons['box']" class="h-5 w-5"></lucide-icon>
        </div>
        <p class="text-sm font-black uppercase tracking-widest text-slate-900">
          {{ mode() === 'platform' ? 'Administration' : 'Workspace' }}
        </p>
      </div>
    </div>

    <!-- Navigation -->
    <div class="flex-1 overflow-y-auto custom-scrollbar px-3 pb-4 space-y-6">

      <!-- Group items by section -->
      @for (item of items(); track item.route; let i = $index) {
        
        @if (i === 0 || item.section !== items()[i-1].section) {
          @if (item.section) {
            <div class="px-4 mt-6 mb-2">
              <p class="text-[10px] font-black text-slate-400 uppercase tracking-[2px]">{{ item.section }}</p>
            </div>
          }
        }

        <a [routerLink]="item.route" routerLinkActive="bg-[#e7f6ed] text-primary font-bold shadow-sm"
          [routerLinkActiveOptions]="{ exact: i === 0 }" class="flex items-center gap-3 rounded-xl px-4 py-3.5 text-sm
                 text-slate-600 transition-all duration-200
                 hover:bg-slate-200/50 hover:text-slate-900 group">

          <lucide-icon [img]="icons[item.icon]"
            class="h-[18px] w-[18px] opacity-70 group-hover:opacity-100 transition-opacity">
          </lucide-icon>

          <span>{{ item.title }}</span>

        </a>
      }

    </div>

  </div>

  <!-- Bottom fixed section -->
  <div class="border-t border-slate-200 bg-white">

    <!-- Profile card -->
    <div class="p-3">
      <div class="rounded-2xl border border-slate-100 bg-white p-4 shadow-sm flex items-center gap-3">
        <div class="h-10 w-10 rounded-full bg-primary/10 border border-primary/20 flex items-center justify-center">
          <lucide-icon [img]="User" class="h-5 w-5 text-primary">
          </lucide-icon>
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold text-slate-900 truncate">
            Admin User
          </p>
          <p class="text-[11px] text-slate-500 truncate">
            System Administrator
          </p>
        </div>
      </div>
    </div>

    <!-- Logout -->
    <div class="p-3 border-t border-slate-100">
      <button (click)="logout()" class="w-full flex items-center gap-3 rounded-xl px-4 py-3
               text-sm text-red-500 font-semibold
               transition hover:bg-red-50">
        <lucide-icon [img]="LogOut" class="h-[18px] w-[18px]">
        </lucide-icon>
        <span>Logout</span>
      </button>
    </div>

  </div>

</aside>
