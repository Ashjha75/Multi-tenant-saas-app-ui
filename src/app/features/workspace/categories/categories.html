<div class="space-y-6">
  <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between mb-8">
    <app-page-header title="Categories" subtitle="Manage product taxonomy and organization"></app-page-header>
    <div class="flex items-center gap-3">
      <button class="flex items-center gap-2 rounded-button border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-50">
        <lucide-icon [img]="Download" class="h-4 w-4"></lucide-icon> Export
      </button>
      <button class="flex items-center gap-2 rounded-button bg-primary px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-primaryHover" (click)="openModal()">
        <lucide-icon [img]="FolderPlus" class="h-4 w-4"></lucide-icon> Create Category
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
    @for (category of categories; track category.id) {
      <div class="group relative rounded-[24px] border border-slate-200 bg-white p-6 shadow-sm transition-all hover:shadow-md hover:border-slate-300">
        <div class="absolute right-4 top-4 flex gap-2 opacity-0 transition-opacity group-hover:opacity-100">
          <button class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-50 text-slate-400 hover:bg-slate-100 hover:text-primary transition-colors" (click)="editCategory(category)">
            <lucide-icon [img]="Edit" class="h-4 w-4"></lucide-icon>
          </button>
          <button class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-50 text-slate-400 hover:bg-slate-100 hover:text-danger transition-colors" (click)="deleteCategory(category.id)">
            <lucide-icon [img]="Trash2" class="h-4 w-4"></lucide-icon>
          </button>
        </div>

        <div class="mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-slate-50 text-slate-500">
          <lucide-icon [img]="getIcon(category.icon)" class="h-6 w-6"></lucide-icon>
        </div>

        <h3 class="mb-1 font-heading text-lg font-bold text-slate-900">{{ category.name }}</h3>
        <p class="mb-4 text-sm text-slate-500 line-clamp-1">{{ category.description || 'No description' }}</p>

        <div class="mt-4 flex items-center justify-between border-t border-slate-100 pt-4">
          <div class="flex items-center gap-2 text-sm font-medium text-slate-700">
            <lucide-icon [img]="Package" class="h-4 w-4 text-slate-400"></lucide-icon>
            {{ category.productsCount || 0 }} Products
          </div>
          <span class="text-xs text-slate-400">Recently updated</span>
        </div>
      </div>
    }
  </div>
</div>

@if (showModal) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm animate-fade-in">
    <div class="w-full max-w-md rounded-[24px] bg-white shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-100 p-6">
        <h3 class="font-heading text-xl font-bold text-slate-900">{{ modalTitle }}</h3>
        <button class="text-slate-400 hover:text-slate-600 transition-colors" (click)="closeModal()">✕</button>
      </div>
      
      <div class="p-6 space-y-6" [formGroup]="categoryForm">
        <app-input label="Category Name *" formControlName="name" placeholder="e.g. Electronics"></app-input>
        
        <div>
          <label class="mb-2 block text-sm font-medium text-slate-700">Description</label>
          <textarea formControlName="description" rows="3" class="w-full rounded-input border border-slate-300 bg-white px-4 py-3 text-sm focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary transition-colors resize-none" placeholder="Short description of this category"></textarea>
        </div>

        <div>
          <label class="mb-2 block text-sm font-medium text-slate-700">Select Icon</label>
          <div class="grid grid-cols-4 gap-3">
            @for (icon of icons; track icon.name) {
              <div 
                class="flex h-12 cursor-pointer items-center justify-center rounded-xl border-2 transition-colors"
                [class.border-primary]="categoryForm.get('icon')?.value === icon.name"
                [class.bg-primary]="categoryForm.get('icon')?.value === icon.name"
                [class.text-white]="categoryForm.get('icon')?.value === icon.name"
                [class.border-slate-100]="categoryForm.get('icon')?.value !== icon.name"
                [class.bg-slate-50]="categoryForm.get('icon')?.value !== icon.name"
                [class.text-slate-500]="categoryForm.get('icon')?.value !== icon.name"
                [class.hover:border-slate-300]="categoryForm.get('icon')?.value !== icon.name"
                (click)="categoryForm.patchValue({ icon: icon.name })"
              >
                <lucide-icon [img]="icon.img" class="h-5 w-5"></lucide-icon>
              </div>
            }
          </div>
        </div>
      </div>

      <div class="border-t border-slate-100 p-6 flex justify-end gap-3 bg-slate-50 rounded-b-[24px]">
        <button class="rounded-button border border-slate-200 bg-white px-6 py-2.5 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-50" (click)="closeModal()">Cancel</button>
        <button class="rounded-button bg-primary px-6 py-2.5 text-sm font-medium text-white shadow-sm transition hover:bg-primaryHover" (click)="saveCategory()">{{ modalAction }}</button>
      </div>
      </div>
    </div>
  </div>
}

<app-confirm-dialog
  [open]="showConfirmDialog"
  title="Delete Category"
  message="Are you sure you want to permanently delete this category?"
  (confirm)="confirmDelete()"
  (cancel)="cancelDelete()">
</app-confirm-dialog>
