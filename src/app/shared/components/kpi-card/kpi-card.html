<article class="rounded-[20px] border border-border bg-[linear-gradient(145deg,#151C2F,#1E293B)] p-5 shadow-card transition hover:shadow-cardHover">
  <p class="text-sm text-slate-400">{{ label() }}</p>
  <p class="mt-2 text-3xl font-bold text-slate-100">{{ value() }}</p>
  <p class="mt-3 text-sm" [class.text-success]="trend() === 'up'" [class.text-danger]="trend() === 'down'" [class.text-slate-400]="trend() === 'neutral'">
    {{ change() }}
  </p>
</article>
