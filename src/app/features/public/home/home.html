<section class="hero-surface rounded-card border border-soft p-8 md:p-10">
  <div class="grid gap-10 lg:grid-cols-[55%_45%] lg:items-center">
    <div>
      <p class="mb-3 inline-flex rounded-full border border-primary/40 bg-primary/10 px-3 py-1 text-xs font-semibold text-primary">Multi-tenant Inventory SaaS</p>
      <h1 class="font-heading text-4xl font-bold leading-tight md:text-6xl">Inventory management built for modern businesses</h1>
      <p class="mt-5 max-w-2xl text-base text-slate-300">
        Manage products, stock movement, multiple organizations and teams from one secure multi-tenant platform.
      </p>
      <div class="mt-8 flex flex-wrap gap-3">
        <a routerLink="/register" class="rounded-button bg-[linear-gradient(90deg,#6366F1,#8B5CF6)] px-6 py-3 text-sm font-semibold text-white transition hover:scale-[1.02]">Start Free Trial</a>
        <button class="glass-surface rounded-button px-6 py-3 text-sm font-semibold text-slate-200">Book Demo</button>
      </div>
    </div>

    <div class="grid gap-4">
      <app-kpi-card label="Products" value="1234" change="+12%" trend="up"></app-kpi-card>
      <app-kpi-card label="Stock In" value="530" change="+8.2%" trend="up"></app-kpi-card>
      <app-kpi-card label="Low Stock" value="14" change="-3 today" trend="down"></app-kpi-card>
    </div>
  </div>
</section>

<section class="mt-10 grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-4">
  <app-kpi-card label="Organizations" value="250+" change="Growing" trend="up"></app-kpi-card>
  <app-kpi-card label="Products Managed" value="50k+" change="Across tenants" trend="up"></app-kpi-card>
  <app-kpi-card label="Stock Movements" value="2M+" change="Tracked" trend="up"></app-kpi-card>
  <app-kpi-card label="Uptime" value="99.9%" change="Reliable" trend="up"></app-kpi-card>
</section>
