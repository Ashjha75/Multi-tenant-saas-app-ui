<div class="space-y-2">
  @if (label()) {
    <label class="text-sm font-medium text-slate-200" [attr.for]="id()">{{ label() }}</label>
  }
  <select class="app-input" [id]="id()" [value]="value()" (change)="onChange($event)">
    @for (option of options(); track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
</div>
