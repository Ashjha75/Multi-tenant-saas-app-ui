<app-page-header title="Pending Approval" subtitle="Your tenant request is currently under review."></app-page-header>

<section class="mx-auto max-w-2xl rounded-card border border-white/5 bg-card p-8 text-center shadow-xl">
  <app-status-badge status="pending"></app-status-badge>
  <ol class="mx-auto mt-6 max-w-md space-y-3 text-left text-sm text-slate-300">
    <li>1. Request Submitted</li>
    <li>2. Under Review</li>
    <li>3. Provisioning</li>
    <li>4. Ready</li>
  </ol>
  <div class="mt-8 flex flex-wrap justify-center gap-3">
    <a routerLink="/" class="rounded-button bg-[linear-gradient(90deg,#6366F1,#8B5CF6)] px-6 py-3 text-sm font-semibold text-white">Return Home</a>
    <a routerLink="/contact" class="glass-surface rounded-button px-6 py-3 text-sm font-semibold text-slate-200">Contact Support</a>
  </div>
</section>
