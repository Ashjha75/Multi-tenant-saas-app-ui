<div class="space-y-2">
  @if (label()) {
    <label class="text-sm font-medium text-slate-200" [attr.for]="id()">
      {{ label() }}
      @if (required()) {
        <span class="text-danger">*</span>
      }
    </label>
  }
  <input
    class="app-input"
    [class.border-danger]="!!error()"
    [attr.id]="id()"
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value"
    [required]="required()"
    [disabled]="isDisabled"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
  @if (error()) {
    <p class="text-xs text-danger">{{ error() }}</p>
  } @else if (hint()) {
    <p class="text-xs text-slate-400">{{ hint() }}</p>
  }
</div>
