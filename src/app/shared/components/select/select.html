<div class="space-y-2">
  @if (label()) {
    <label class="text-sm font-medium text-slate-700" [attr.for]="id()">{{ label() }}</label>
  }
  <select
    class="flex h-12 w-full rounded-input border border-slate-300 bg-white px-4 py-2 text-sm text-slate-900 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary disabled:cursor-not-allowed disabled:bg-slate-100 disabled:opacity-50 transition-colors shadow-sm appearance-none"
    [class.border-danger]="!!error()"
    [id]="id()"
    [value]="value"
    [disabled]="isDisabled"
    (change)="onSelect($event)"
    (blur)="onBlur()"
  >
    <option value="">{{ placeholder() }}</option>
    @for (option of options(); track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
  @if (error()) {
    <p class="text-xs text-danger">{{ error() }}</p>
  }
</div>
