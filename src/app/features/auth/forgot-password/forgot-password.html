<app-page-header title="Forgot Password" subtitle="Reset your account access securely."></app-page-header>

<section class="mx-auto max-w-xl rounded-card border border-white/5 bg-card p-6 shadow-xl">
  <div class="mb-4 flex items-center gap-3 text-slate-300">
    <lucide-icon [img]="Mail"></lucide-icon>
    <span class="text-sm">Enter your email to receive reset instructions.</span>
  </div>
  <form class="space-y-6" [formGroup]="form" (ngSubmit)="submit()">
    <app-input label="Email" formControlName="email" [error]="form.controls.email.touched && form.controls.email.invalid ? 'Valid email required' : ''"></app-input>
    <app-button type="submit" [block]="true">Send Reset Link</app-button>
  </form>
</section>

<app-modal [open]="modalOpen()" title="Reset Link Sent" (close)="modalOpen.set(false)">
  <p class="text-sm text-slate-300">If your email exists in our system, a reset link has been sent.</p>
</app-modal>
