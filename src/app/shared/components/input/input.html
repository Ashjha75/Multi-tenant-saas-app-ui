<div class="space-y-2">
  @if (label()) {
    <label class="text-sm font-medium text-slate-700" [attr.for]="id()">
      {{ label() }}
      @if (required()) {
        <span class="text-danger">*</span>
      }
    </label>
  }
  <input
    class="flex h-12 w-full rounded-input border border-slate-300 bg-white px-4 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary disabled:cursor-not-allowed disabled:bg-slate-100 disabled:opacity-50 transition-colors shadow-sm"
    [class.border-danger]="!!error()"
    [attr.id]="id()"
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value"
    [required]="required()"
    [disabled]="isDisabled"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
  @if (error()) {
    <p class="text-xs text-danger">{{ error() }}</p>
  } @else if (hint()) {
    <p class="text-xs text-slate-400">{{ hint() }}</p>
  }
</div>
