<div class="min-h-screen bg-slate-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-4xl">
    <div class="flex justify-center mb-6">
      <div class="h-16 w-16 bg-primary rounded-[20px] flex items-center justify-center shadow-lg shadow-primary/20 rotate-3 hover:rotate-0 transition-transform">
        <lucide-icon [img]="Building2" class="h-8 w-8 text-white"></lucide-icon>
      </div>
    </div>
    <h2 class="text-center text-3xl font-black text-slate-900 tracking-tight">Create your Workspace</h2>
    <p class="mt-2 text-center text-sm text-slate-500 font-medium">
      Launch your multi-tenant platform in minutes.
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-4xl">
    <div class="bg-white py-10 px-8 shadow-2xl shadow-slate-200/50 sm:rounded-[40px] border border-slate-100 relative overflow-hidden">
      <!-- Decorator -->
      <div class="absolute top-0 right-0 -mt-4 -mr-4 h-32 w-32 bg-primary/5 rounded-full blur-3xl"></div>
      
      <form class="space-y-10" [formGroup]="registerForm" (ngSubmit)="submit()">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-10">
          
          <!-- Company Details Section -->
          <div class="space-y-8">
            <div class="flex items-center gap-3 pb-2 border-b border-slate-50">
              <div class="h-8 w-8 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
                <lucide-icon [img]="Building2" class="h-4 w-4"></lucide-icon>
              </div>
              <h3 class="text-lg font-bold text-slate-900 uppercase tracking-wider">Company Information</h3>
            </div>
            
            <app-input 
              label="Company Name *" 
              formControlName="companyName" 
              placeholder="e.g. Acme Corporation"
              [error]="registerForm.get('companyName')?.touched && registerForm.get('companyName')?.errors?.['required'] ? 'Company name is required' : ''"
            ></app-input>

            <app-input 
              label="Workspace URL Code *" 
              formControlName="companyCode" 
              placeholder="e.g. acme-corp"
              hint="Lowercase, numbers, and hyphens only (e.g. yourcompany.app)"
              [error]="registerForm.get('companyCode')?.touched && registerForm.get('companyCode')?.errors ? 'Invalid URL code format' : ''"
            ></app-input>

            <app-input 
              label="Company Email *" 
              type="email"
              formControlName="email" 
              placeholder="contact@acme.com"
              [error]="registerForm.get('email')?.touched && registerForm.get('email')?.errors ? 'Valid email required' : ''"
            ></app-input>
          </div>

          <!-- Admin Details Section -->
          <div class="space-y-8">
            <div class="flex items-center gap-3 pb-2 border-b border-slate-50">
              <div class="h-8 w-8 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
                <lucide-icon [img]="User" class="h-4 w-4"></lucide-icon>
              </div>
              <h3 class="text-lg font-bold text-slate-900 uppercase tracking-wider">Administrator Details</h3>
            </div>

            <app-input 
              label="Full Name *" 
              formControlName="adminFullName" 
              placeholder="e.g. John Doe"
              [error]="registerForm.get('adminFullName')?.touched && registerForm.get('adminFullName')?.errors ? 'Name is required' : ''"
            ></app-input>

            <app-input 
              label="Admin Username *" 
              formControlName="adminUsername" 
              placeholder="e.g. admin"
              [error]="registerForm.get('adminUsername')?.touched && registerForm.get('adminUsername')?.errors ? 'Username required (min 4 chars)' : ''"
            ></app-input>

            <app-input 
              label="Admin Email *" 
              type="email"
              formControlName="adminEmail" 
              placeholder="admin@acme.com"
              [error]="registerForm.get('adminEmail')?.touched && registerForm.get('adminEmail')?.errors ? 'Valid admin email required' : ''"
            ></app-input>

            <app-input 
              label="Secure Password *" 
              type="password"
              formControlName="adminPassword" 
              placeholder="••••••••"
              hint="8+ chars with Uppercase, Number, and Symbol"
              [error]="registerForm.get('adminPassword')?.touched && registerForm.get('adminPassword')?.errors ? 'Password does not meet complexity requirements' : ''"
            ></app-input>
          </div>
        </div>

        <div class="pt-10 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-6">
          <div class="flex items-center gap-3 text-slate-400">
            <lucide-icon [img]="CheckCircle2" class="h-5 w-5 text-primary"></lucide-icon>
            <span class="text-sm font-medium">By registering, you agree to our Terms of Service.</span>
          </div>

          <div class="flex items-center gap-4 w-full sm:w-auto">
            <a routerLink="/login" class="text-sm font-bold text-slate-500 hover:text-primary transition-colors px-4 py-2">
              Back to Login
            </a>
            <button 
              type="submit"
              [disabled]="loading()"
              class="flex-1 sm:flex-none flex items-center justify-center gap-3 rounded-2xl bg-primary px-10 py-4 text-sm font-black text-white shadow-xl shadow-primary/20 hover:bg-primaryHover hover:scale-[1.02] active:scale-[0.95] disabled:opacity-50 disabled:cursor-not-allowed transition-all"
            >
              @if (loading()) {
                <div class="h-5 w-5 animate-spin rounded-full border-2 border-white border-t-transparent"></div>
                Registering...
              } @else {
                Create Workspace <lucide-icon [img]="ArrowRight" class="h-5 w-5"></lucide-icon>
              }
            </button>
          </div>
        </div>
      </form>
    </div>

    <div class="mt-8 text-center">
      <p class="text-sm text-slate-400">
        Already have a workspace? 
        <a routerLink="/login" class="font-bold text-primary hover:underline">Sign in here</a>
      </p>
    </div>
  </div>
</div>
